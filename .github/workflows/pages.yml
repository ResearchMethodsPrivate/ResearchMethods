# Builds the Week 5 deck (crda-week5-deck/) and the Week 9 deck (crda-week9-deck/)
# and publishes both to GitHub Pages:
#   <site>/         the Week 5 deck (unchanged URL)
#   <site>/week9/   the Week 9 deck
#   pull request -> install, validate, test and build only (nothing is published)
#   push to main  -> the same, then deploy to Pages
#   manual run    -> Actions tab > "Deploy deck to GitHub Pages" > Run workflow
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy deck to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'crda-week5-deck/**'
      - 'crda-week9-deck/**'
      - 'results/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'crda-week5-deck/**'
      - 'crda-week9-deck/**'
      - 'results/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # OpenUI's install script (Week 5 deck) sends anonymous telemetry unless told not to.
      OPENUI_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            crda-week5-deck/package-lock.json
            crda-week9-deck/package-lock.json

      - name: Week 5 deck
        working-directory: crda-week5-deck
        run: |
          npm ci
          npm run validate:deck
          npm test
          npm run build

      - name: Week 9 deck
        working-directory: crda-week9-deck
        run: |
          npm ci
          npm run validate:ready
          npm test
          npm run build

      - name: Assemble site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site/week9
          cp -r crda-week5-deck/dist/. _site/
          cp -r crda-week9-deck/dist/. _site/week9/

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
